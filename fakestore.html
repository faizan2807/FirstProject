<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fakestore</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script>

        function LoadCategories() {
            fetch("https://fakestoreapi.com/products/categories&quot")
                .then(function (response) {
                    return response.json();
                })
                .then(function (categories) {
                    categories.unshift("all");
                    categories.map(function (category) {
                        var option = document.createElement("option");
                        option.text = category.toUpperCase();
                        option.value = category;
                        document.getElementById("lstCategories").appendChild(option);
                    })
                })
        }

        function LoadProducts(url) {
            fetch(url)
                .then(function (response) {
                    return response.json();
                })
                .then(function (products) {
                    document.querySelector("main").innerHTML = "";
                    products.map(function (product) {
                        var div = document.createElement("div");
                        div.className = "card p-2 m-2";
                        div.style.width = "200px";
                        div.innerHTML = `
                        <img src=${product.image} class="card-img-top" height="120">
                        <div class="card-header overflow-auto" style="height:120px">
                            ${product.title}
                        </div>
                        <div class="card-body">
                            <dl>
                                <dt>Price</dt>
                                <dd>${product.price}</dd>
                                <dt>Rating</dt>
                                <dd>${product.rating.rate} <span class="bi bi-star-fill text-success"></span> [${product.rating.count}] </dd>
                            </dl>
                        </div>
                        <div class="card-footer">
                            <button onclick="AddToCartClick(${product.id})" class="btn btn-dark w-100 bi bi-cart3"> Add to Cart </button>
                        </div>
                     `
                        document.querySelector("main").appendChild(div);
                    })
                })
        }

        function bodyload() {
            LoadCategories();
            LoadProducts("https://fakestoreapi.com/products");
            GetCartCount();
            SearchClick();
        }

        function CategoryChange() {
            var categoryName = document.getElementById("lstCategories").value;
            
            console.log(categoryName)
            if (categoryName === "-1") {
                LoadProducts("https://fakestoreapi.com/products");
            } else {
                LoadProducts(`https://fakestoreapi.com/products/category/${categoryName}`);
            }
        }


        var cartItems = [];

        function GetCartCount() {
            document.getElementById("lblCount").innerHTML = cartItems.length;
        }

        function AddToCartClick(id) {
            fetch(`https://fakestoreapi.com/products/${id}`)
                .then(function (response) {
                    return response.json();
                })
                .then(function (product) {
                    alert(`${product.title}\nAdded to Cart`);
                    cartItems.push(product);
                    GetCartCount();
                })
        }

        function ShowCartClick() {
            document.querySelector("tbody").innerHTML = "";
            cartItems.map(function (item) {
                var tr = document.createElement("tr");
                var tdTitle = document.createElement("td");
                var tdPrice = document.createElement("td");
                var tdImage = document.createElement("td");

                tdTitle.innerHTML = item.title;
                tdPrice.innerHTML = item.price;
                tdImage.innerHTML = `<img src=${item.image} width="50" height="50">`;

                tr.appendChild(tdTitle);
                tr.appendChild(tdImage);
                tr.appendChild(tdPrice);

                document.querySelector("tbody").appendChild(tr);
            })
        }

      /*  function SearchClick(){
            var Search = 'https://fakestoreapi.com/products'
            console.log(ProductName)
            if(Search==="Electronic"){
                LoadProducts('https://fakestoreapi.com/products/category/electronics')
            }else if(Search==="jewelery"){
                LoadProducts('https://fakestoreapi.com/products/category/jewelery')
            }else if (Search==="men fashion"){
                LoadProducts('https://fakestoreapi.com/products/category/womens%20clothing')
            }else if(Search==="women fashion"){
                LoadProducts('https://fakestoreapi.com/products/category/womens%20clothing')
            }else{
                <h2> 404 Not Found </h2>
            }
        }*/
    </script>
</head>

<body class="container-fluid" onload="bodyload()">
    <header class="d-flex justify-content-between p-3 fs-5 bg-dark text-white">
        <span class="h3">Shopper.</span>
        <nav>
            <span class="mx-2"><a class="link-light text-decoration-none"
                    href="javascript:LoadProducts('https://fakestoreapi.com/products')">Home</a></span>
            <span class="mx-2"><a class="link-light text-decoration-none"
                    href="javascript:LoadProducts('https://fakestoreapi.com/products/category/electronics')">Electronics</a></span>
            <span class="mx-2"><a class="link-light text-decoration-none" href="javascript:LoadProducts('https://fakestoreapi.com/products/category/jewelery')">Jewelery</a></span>
            <span class="mx-2"><a class="link-light text-decoration-none" href="javascript:LoadProducts('https://fakestoreapi.com/products/category/men's%20clothing')">men's fashion</a></span>
            <span class="mx-2"><a class="link-light text-decoration-none" href="javascript:LoadProducts('https://fakestoreapi.com/products/category/women's%20clothing')">women's fashion</a></span>
        </nav>
        <div>
            <span class="bi bi-heart mx-2"></span>
           <span class="bi bi-search mx-2 onclick="SearchClick()"></span>
            <button data-bs-target="#cart" data-bs-toggle="modal" onclick="ShowCartClick()"
                class="btn btn-warning bi-cart3 position-relative">
                Your Cart <span class="rounded rounded-circle position-absolute top-0 end-0 badge bg-danger"
                    id="lblCount"></span>
            </button>
            <div class="modal fade" id="cart">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2 class="text-primary">Your Cart Items</h2>
                            <button class="btn btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Title</th>
                                        <th>Preview</th>
                                        <th>Price</th>
                                    </tr>
                                </thead>
                                <tbody>

                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <section class="row mt-3">
        <nav class="col-2">
            <label class="form-label fw-bold">Select Category</label>
            <div>
                <select class="form-select" id="lstCategories" onchange="CategoryChange()">
                    <option value="-1">Select category</option>
                    <option value="electronics">Electronics</option>
                    <option value="jewelery">Jewelery</option>
                    <option value="men's clothing">Men's Fashion</option>
                    <option value="women's clothing">Women's Fashion</option>
                </select>
            </div>
        </nav>
        <main class="col-10 overflow-auto d-flex flex-wrap" style="height: 500px;">

        </main>
    </section>
    <footer>
       <div class="bg-dark">
        <h2 class="text-white">Want Style Ideas and Trends?</h2>
        <span><input type="email"><button>subscribe</button></span>
       </div>
    </footer>
</body>

</html>
