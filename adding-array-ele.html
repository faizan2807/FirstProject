<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
var categories = ["All","Fashion","Footware","Electronic",]
function bodyload(){
    categories.push("Amazon");
    categories.unshift("About");
    categories.splice(3,0,"kids","womens");
    categories.map(function(category){
        var span =document.createElement("span");
        span.innerHTML = `<a href ='${category}'>${category}</a>`;
        document.querySelector("nav").appendChild(span);
    })
}
    </script>
    <style>
        nav{
            font-size: 20px;
            font-family: arial;
            padding: 10px;
            background-color: black;
            color: white;
            justify-content: space-between;
            display:flex;
        }
        a{
            text-decoration: none;
            color: white;
        }
    </style>
</head>
<body onload="bodyload()">
    <nav>

    </nav>
</body>
</html>
